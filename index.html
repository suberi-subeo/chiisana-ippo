const dkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function holidaysOf(y){
  if (HOL[y]) return HOL[y];

  const nthMon = (mo,n) => { const f = new Date(y, mo-1, 1).getDay(); return 1 + ((8 - f) % 7) + (n-1)*7; };

  for (let d = new Date(y,0,2); d.getFullYear()===y; d.setDate(d.getDate()+1)) { const k = dkey(d); if (!m[k] && d.getDay()!==0 && m[dkey(addDays(d,-1))] && m[dkey(addDays(d,1))]) m[k] = '国民の休日'; }

  return HOL[y] = m;

function blankState(){
  return { v:2, goals:[], mainGoal:null, tasks:[], routine:[], oneoffs:[], skips:{}, done:{}, log:{}, reviews:{}, env:['スマホを別の部屋に置く','机の上を片付ける','飲み物を用意する'], settings:{partner:'ピポ', color:'#2F6F60', challengeOffset:{}}, lastOpen:null, created: todayKey() };
}
let S = blankState();
let db = null, docRef = null, saveTimer = null, ready = false, storeMode = 'loading', dirty = false;
let ui = { calView:'month', calMonth:null, day:todayKey(), wiz:null, timer:null, splitFor:null, welcome:false, msg:null, review:{weekOf:null}, editBlk:null };

/* ---------- goals (up to 5; one is the main goal) ---------- */
function G(){ return S.goals.find(g=>g.id===S.mainGoal) || S.goals[0] || null; }
function goalById(id){ return id ? (S.goals.find(g=>g.id===id) || null) : null; }
function goalOrder(){ const m=G(); return m ? [m].concat(S.goals.filter(g=>g!==m)) : []; }
function goalColor(id){ const g=goalById(id)||G(); return g ? g.color : '#2F6F60'; }
function gdot(id){ return S.goals.length>1 ? '<i class="gdot" style="background:'+goalColor(id)+'" aria-hidden="true"></i>' : ''; }
function goalsDue(k){ return goalOrder().filter(g=>g.due===k); }
function nextColor(){ return GOAL_COLORS.find(c=>!S.goals.some(g=>g.color===c)) || GOAL_COLORS[S.goals.length%GOAL_COLORS.length]; }
function migrate(){
  const before = JSON.stringify(S);
  if (!Array.isArray(S.goals)) S.goals = [];
  if (S['goal'] && !S.goals.length) S.goals.push(Object.assign({id:'g'+uid(), color:GOAL_COLORS[0]}, S['goal']));
  delete S['goal'];
  S.goals.forEach((g,i)=>{ if(!g.id) g.id='g'+uid(); if(!g.color) g.color=GOAL_COLORS[i%GOAL_COLORS.length]; });
  if (!goalById(S.mainGoal)) S.mainGoal = S.goals.length ? S.goals[0].id : null;
  for (const t of S.tasks) if (!goalById(t.goalId)) t.goalId = S.mainGoal;
  return JSON.stringify(S) !== before;
}
function wpGoal(){ return goalById(ui.wpGoal) || G(); }
function wpMsg(){ const m=(S.settings.wpMsg||'').trim(); return (!m || m==='今日もちいさな一歩、いっしょに進もう！') ? WP_MSGS[0] : m; }
function routineLabel(r){
  if (r.kind!=='goal') return esc(r.title);
  if (S.goals.length<2) return '目標タイム';
  const g = goalById(r.goalId); return gdot(g?g.id:null)+'目標タイム（'+(g?esc(g.title):'おまかせ')+'）';
}
function goalSelect(id, label){
  if (S.goals.length<2) return '';
  return '<label class="fld">'+label+'<select id="'+id+'"><option value="">おまかせ（いちばん大事な目標から）</option>'+goalOrder().map(g=>'<option value="'+g.id+'">'+esc(g.title)+'</option>').join('')+'</select></label>';
}

function save(){
  clearTimeout(saveTimer); dirty = true;
  saveTimer = setTimeout(() => { try { localStorage.setItem('chiisana-ippo', JSON.stringify(S)); dirty = false; } catch(e){ toast('保存できませんでした。ブラウザの設定をご確認ください。'); } }, 300);
}
function logOf(k){ return S.log[k] || (S.log[k] = {goal:0, minutes:0, tasks:0, challenge:false}); }

/* ---------- task tree ---------- */
function children(id){ return S.tasks.filter(t => (t.parentId||null) === id); }
function ordered(){ const out=[]; const walk=(pid,depth)=>{ for(const t of children(pid)){ out.push({t,depth}); walk(t.id, depth+1);} }; walk(null,0); return out; }
function leaves(){ return ordered().map(o=>o.t).filter(t => children(t.id).length===0); }
function nextTasks(gid){ const ls = leaves().filter(t => !t.done); if (gid) return ls.filter(t=>t.goalId===gid); const ord = goalOrder().map(g=>g.id); return ls.sort((a,b)=>ord.indexOf(a.goalId)-ord.indexOf(b.goalId)); }
function setDone(task, on, k){
  task.done = on; task.doneAt = on ? (k||todayKey()) : null;
  const L = logOf(k||todayKey()); L.tasks = Math.max(0, (L.tasks||0) + (on?1:-1));
  // parent completes when all children are done
  let p = task.parentId ? S.tasks.find(x=>x.id===task.parentId) : null;
  while (p) { const kids = children(p.id); p.done = kids.every(c=>c.done); p.doneAt = p.done ? (k||todayKey()) : null; p = p.parentId ? S.tasks.find(x=>x.id===p.parentId) : null; }
}

/* ---------- day plan ---------- */
function itemsFor(k){
  const wd = parseKey(k).getDay();
  const skips = S.skips[k] || [];
  const items = [];
  for (const r of S.routine) if (r.days.includes(wd) && !skips.includes(r.id)) items.push({key:'r:'+r.id, rid:r.id, start:r.start, end:r.end, title:r.title, kind:r.kind, goalId:r.goalId||null});
  for (const o of S.oneoffs) if (o.date === k) items.push({key:'o:'+o.id, oid:o.id, start:o.start, end:o.end, title:o.title, kind:o.kind, taskId:o.taskId||null, goalId:o.goalId||null});
  items.sort((a,b)=>toMin(a.start)-toMin(b.start));
  // fill goal-time slots with the next unfinished tasks
  const doneMap = S.done[k] || {};
  // a slot tied to a goal takes that goal's tasks; "おまかせ" takes the main goal's first
  const used = new Set(items.map(i=>i.taskId).filter(Boolean));
  const pools = {}; const pool = gid => pools[gid] || (pools[gid] = nextTasks(gid));
  const take = gid => { const ids = goalById(gid) ? [gid] : goalOrder().map(g=>g.id); for (const id of ids) { const p = pool(id); while (p.length) { const t = p.shift(); if (!used.has(t.id)) { used.add(t.id); return t; } } } return null; };
  for (const it of items) {
    it.done = !!doneMap[it.key];
    if (it.kind === 'goal') {
      if (doneMap[it.key] && doneMap[it.key].taskId) { it.task = S.tasks.find(t=>t.id===doneMap[it.key].taskId) || null; if (it.task) used.add(it.task.id); }
      else if (k >= todayKey()) it.task = take(it.goalId);
    }
    if (it.kind === 'task' && it.taskId) it.task = S.tasks.find(t=>t.id===it.taskId) || null;
  }
  return items;
}
function plannedGoal(k){ return itemsFor(k).some(i=>i.kind==='goal'); }
function activeDays(){ return Object.keys(S.log).filter(k => { const L=S.log[k]; return L.goal>0 || L.tasks>0 || L.challenge; }).length; }

/* ---------- partner (Pipo) ---------- */
function pipo(size, mood){
  const c = S.settings.color || '#2F6F60';
  const eyes = mood==='happy' || mood==='wave'
    ? '<path d="M22 31 q4 -5 8 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M34 31 q4 -5 8 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M27 35 q5 5 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>'
    : '<circle cx="26" cy="30" r="3.5" fill="#fff"/><circle cx="38" cy="30" r="3.5" fill="#fff"/><path d="M28 36 q4 3 8 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>';
  const arm = mood==='wave' ? '<path d="M54 30 l6 -8" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/><circle cx="61" cy="20" r="2.5" fill="#fff" stroke="'+c+'" stroke-width="2"/>' : '';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" role="img" aria-label="相棒の'+esc(S.settings.partner)+'"><line x1="32" y1="7" x2="32" y2="15" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="6" r="4" fill="#C9853F"/><rect x="10" y="15" width="44" height="34" rx="16" fill="#fff" stroke="'+c+'" stroke-width="3"/><rect x="17" y="21" width="30" height="21" rx="10" fill="'+c+'"/>'+eyes+'<circle cx="14" cy="38" r="2.5" fill="#F2B8A0"/><circle cx="50" cy="38" r="2.5" fill="#F2B8A0"/><rect x="21" y="50" width="22" height="10" rx="5" fill="#fff" stroke="'+c+'" stroke-width="3"/>'+arm+'</svg>';
}
function say(text, mood){ return '<div class="row" style="align-items:flex-start"><div class="pipo">'+pipo(48, mood||'normal')+'<span class="xs muted">'+esc(S.settings.partner)+'</span></div><div class="bubble grow pop">'+esc(text)+'</div></div>'; }
function greeting(){
  const h = new Date().getHours(); const set = h<11 ? GREET.morning : h<17 ? GREET.day : GREET.night;
  return set[hashOf(todayKey())%set.length];
}

/* ---------- toast & reminders ---------- */
let toastT=null;
function toast(msg){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},4000); }
const reminded = {};
setInterval(() => {
  if (!ready || !S.goals.length) return;
  const k = todayKey(), now = new Date(); const m = now.getHours()*60+now.getMinutes();
  for (const it of itemsFor(k)) {
    if (it.kind==='fixed' || it.done) continue;
    const st = toMin(it.start);
    if (m >= st-5 && m <= st && !reminded[k+it.key]) { reminded[k+it.key]=true; ui.msg = 'そろそろ「'+(it.task?it.task.title:it.title)+'」の時間です（'+it.start+'）。まずは準備だけでもOKです。'; render(); }
  }
}, 30000);

/* ---------- router ---------- */
function route(){ const h = (location.hash||'').replace('#',''); return ['home','day','calendar','review','more','setup'].includes(h) ? h : 'home'; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });

function render(){
  const r = route();
  document.querySelectorAll('.tab').forEach(a => { const on = a.dataset.tab===r || (r==='setup' && a.dataset.tab==='more'); a.classList.toggle('on', on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.getElementById('tabs').hidden = (r==='setup' || !!ui.timer);
  if (!ready) return;
  let html = '';
  if (ui.timer) html = viewTimer();
  else if (r==='setup' || (!S.goals.length && r!=='more')) html = viewSetup();
  else if (r==='home') html = viewHome();
  else if (r==='day') html = viewDay();
  else if (r==='calendar') html = viewCalendar();
  else if (r==='review') html = viewReview();
  else if (r==='more') html = viewMore();
  if (ui.welcome && !ui.timer && G()) html += viewWelcome();
  $app.innerHTML = html;
  if (r==='more' && !ui.timer) drawWallpaper();
  if (r==='day' && !ui.timer) { const g=document.getElementById('daygrid'); if(g && ui.day===todayKey()){ const now=new Date(); const y=(now.getHours()*60+now.getMinutes())*0.7; const sc=g.closest('.scrollbox'); if(sc) sc.scrollTop=Math.max(0,y-120);} }
}

/* ---------- HOME ---------- */
function viewHome(){
  const k = todayKey(), g = G();
  const left = g.due ? daysBetween(k, g.due) : null;
  const items = itemsFor(k).filter(i=>i.kind!=='fixed');
  const off = (S.settings.challengeOffset||{})[k]||0;
  const ch = CHALLENGES[(hashOf(k)+off)%CHALLENGES.length];
  const L = S.log[k]||{};
  const undated = nextTasks().filter(t=>!items.some(i=>i.task && i.task.id===t.id)).slice(0,3);
  let h = '<div class="wrap">';
  h += '<div class="row"><span class="grow" style="font-weight:700;color:var(--accent)">ちいさな一歩</span><span class="small muted">'+fmtDate(k)+'</span></div>';
  
  if (ui.msg) h += '<div class="banner" role="status">'+esc(ui.msg)+' <button class="link" data-act="dismissMsg">閉じる</button></div>';
  h += '<section class="card goalcard" aria-label="わたしの目標"><span class="xs muted">'+(S.goals.length>1?'いちばん大事な目標':'わたしの目標')+'</span><span class="big">'+esc(g.title)+'</span>';
  if (left!==null) h += '<div class="row" style="align-items:baseline;gap:6px"><span class="small muted">'+(left>=0?'達成日まであと':'達成日から')+'</span><span class="num">'+Math.abs(left)+'</span><span class="small muted">日'+(left<0?'たちました':'')+'（'+fmtDate(g.due)+'）</span></div>';
  if (g.reason) h += '<p class="small muted">なぜ：'+esc(g.reason)+'</p>';
  h += '</section>';
  const others = goalOrder().slice(1);
  if (others.length) { h += '<section class="card" aria-label="ほかの目標" style="gap:4px"><span class="xs muted">ほかの目標</span>';
    for (const o of others) { const lf = o.due ? daysBetween(k, o.due) : null; h += '<div class="row" style="gap:0">'+gdot(o.id)+'<span class="grow small">'+esc(o.title)+'</span>'+(lf!==null&&lf>=0?'<span class="xs muted">あと'+lf+'日</span>':'')+'</div>'; }
    h += '</section>'; }
  h += say(ui.praise || greeting(), ui.praise ? 'happy' : 'normal');
  h += '<section style="display:flex;flex-direction:column;gap:8px"><h2>今日のタスク</h2>';
  if (!items.length && !undated.length) h += '<div class="card"><p class="small muted">今日の予定はまだありません。「今日の予定」から目標タイムを入れてみましょう。</p><a class="btn ghost sm" href="#day">今日の予定を開く</a></div>';
  for (const it of items) h += taskRow(it, k);
  if (undated.length) {
    h += '<h3 class="small muted" style="margin-top:4px">次にやること</h3>';
    for (const t of undated) h += taskRow({key:'t:'+t.id, kind:'free', task:t, title:t.title, done:t.done}, k);
  }
  h += '</section>';
  h += '<section class="card warm"><div class="row wrap-row"><div class="grow"><span class="xs" style="color:var(--warm);font-weight:700">今日のちいさな挑戦</span><p>'+esc(ch)+'</p></div>';
  h += L.challenge ? '<span class="small" style="color:var(--warm);font-weight:700">やってみた！</span>' : '<button class="btn warmb sm" data-act="challenge">やってみた</button><button class="link" data-act="challengeNext">別のにする</button>';
  h += '</div></section>';
  h += '<p class="small muted" style="text-align:center">これまでに取り組んだ日：合計 <b style="color:var(--ink)">'+activeDays()+'日</b></p>';
  h += '</div>';
  return h;
}
function taskRow(it, k){
  const t = it.task; const title = t ? t.title : it.title;
  const done = it.kind==='free' ? !!(t&&t.done) : (it.done || (t && t.done && it.kind==='task'));
  const isGoal = it.kind==='goal';
  let h = '<div class="task'+(isGoal?' goal':'')+(done?' done':'')+'">';
  h += '<div class="row">';
  if (!isGoal) h += '<input type="checkbox" id="ck-'+esc(it.key)+'" data-act="toggle" data-key="'+esc(it.key)+'" '+(done?'checked':'')+' style="width:22px;height:22px;accent-color:var(--accent)" aria-label="'+esc(title)+' を完了にする">';
  h += '<div class="grow">';
  if (it.start) h += '<span class="time">'+esc(it.start)+(it.end?'〜'+esc(it.end):'')+(isGoal?' 目標タイム':'')+'</span><br>';
  if (S.goals.length>1 && (t || it.goalId)) h += gdot(t ? t.goalId : it.goalId);
  h += '<span class="ttl">'+esc(isGoal ? (t ? t.title : (done?'目標タイム（完了）':'やることを決めましょう')) : title)+'</span>';
  if (t && t.minutes) h += ' <span class="xs muted">約'+t.minutes+'分</span>';
  h += '</div>';
  if (isGoal && !done) h += '<button class="btn" data-act="start" data-key="'+esc(it.key)+'">始める</button>';
  if (isGoal && done) h += '<span class="small" style="color:var(--accent);font-weight:700">できた</span>';
  h += '</div>';
  if (t && !done) {
    if (ui.splitFor === t.id) h += splitForm(t);
    else h += '<button class="link" data-act="split" data-id="'+t.id+'">気が重いときは「もっと小さくする」</button>';
  }
  h += '</div>';
  return h;
}
function splitForm(t){
  return '<div class="card soft" style="padding:10px 12px"><p class="small">「'+esc(t.title)+'」を分けてみましょう。</p><p class="xs muted">これを作っている要素は？ どんなステップで進められる？ 1行に1つずつ書いてください。</p><label class="fld"><span class="sr">小さなタスク</span><textarea id="split-text" placeholder="例：問題集を机に出す&#10;Part5を3問だけ解く&#10;答え合わせをする"></textarea></label><div class="row"><button class="btn sm" data-act="splitSave" data-id="'+t.id+'">分ける</button><button class="link" data-act="splitCancel">やめる</button></div></div>';
}

/* ---------- TIMER ---------- */
function viewTimer(){
  const T = ui.timer;
  if (T.phase==='env') {
    let h = '<div class="wrap"><h1>始める前に、環境を整えましょう</h1>'+say('意志の力より、環境の力。チェックできたら始めましょう。');
    h += '<div class="card">';
    S.env.forEach((e,i)=>{ h += '<label class="check"><input type="checkbox" id="env-'+i+'" data-act="envck" data-i="'+i+'" '+(T.env[i]?'checked':'')+'><span>'+esc(e)+'</span></label>'; });
    h += '</div><div class="card"><p class="small"><b>'+esc(T.title)+'</b></p><label class="fld">時間（分）<input type="number" id="tm-min" min="1" max="180" value="'+T.minutes+'"></label></div>';
    h += '<button class="btn block" data-act="timerGo">タイマーを始める</button><button class="link" data-act="timerCancel" style="align-self:center">やめる</button></div>';
    return h;
  }
  const rem = Math.max(0, T.endAt - Date.now()); const mm = Math.floor(rem/60000), ss = Math.floor(rem/1000)%60;
  let h = '<div class="wrap" style="align-items:stretch">';
  h += '<p class="small muted" style="text-align:center">目標タイム</p><h1 style="text-align:center">'+esc(T.title)+'</h1>';
  h += '<div style="display:flex;justify-content:center">'+pipo(96, rem===0?'happy':'normal')+'</div>';
  h += '<div class="timer" id="timer-num" aria-live="off">'+pad(mm)+':'+pad(ss)+'</div>';
  h += rem===0 ? say('時間です！おつかれさまでした。','happy') : '<p class="small muted" style="text-align:center">終わったら下のボタンを押してください。早く終わってもOKです。</p>';
  h += '<button class="btn block" data-act="timerDone">できた！</button><button class="link" data-act="timerCancel" style="align-self:center">今日はここまでにする</button></div>';
  return h;
}
let tick=null;
function startTick(){ clearInterval(tick); tick=setInterval(()=>{ if(!ui.timer||ui.timer.phase!=='run'){clearInterval(tick);return;} const el=document.getElementById('timer-num'); const rem=Math.max(0,ui.timer.endAt-Date.now()); if(rem===0){ clearInterval(tick); render(); return;} if(el) el.textContent=pad(Math.floor(rem/60000))+':'+pad(Math.floor(rem/1000)%60); },1000); }

/* ---------- SETUP WIZARD ---------- */
function newWiz(gid){
  const cur = gid==='new' ? null : (goalById(gid) || G()); const g = cur || {};
  return { step: cur ? 1 : 0, gid: cur ? cur.id : null, tpl: g.tpl||null, title:g.title||'', due:g.due||'', reason:g.reason||'', future:g.future||'', criteria:g.criteria||'', milestones:g.milestones||'', q1:null, q2:null, needs:Object.assign({},g.needs||{}), tasks: [], goalStart:'07:00', goalMin:15, goalDays:[1,2,3,4,5], editing: !!cur };
}
const STEPS = ['目標の種類','目標と達成日','理由と未来','目標チェック','必要なもの','タスク','目標タイム'];
function viewSetup(){
  if (!ui.wiz) ui.wiz = newWiz(ui.wizGoal);
  const W = ui.wiz; const n = STEPS.length;
  let h = '<div class="wrap">';
  h += '<div class="row"><button class="link" data-act="wizBack">'+(W.step===0 ? (S.goals.length?'閉じる':'') : 'もどる')+'</button><span class="grow small muted" style="text-align:center">ステップ '+(W.step+1)+' / '+n+'：'+STEPS[W.step]+'</span><span style="width:44px"></span></div>';
  h += '<div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="'+n+'" aria-valuenow="'+(W.step+1)+'"><i style="width:'+Math.round((W.step+1)/n*100)+'%"></i></div>';
  const tpl = TEMPLATES.find(t=>t.id===W.tpl) || TEMPLATES[TEMPLATES.length-1];
  if (W.step===0){
    h += '<h1>どんな目標に取り組みますか？</h1>'+say(W.editing?'目標を見直しましょう。':S.goals.length?'新しい目標ですね。いっしょに作りましょう。':'はじめまして、'+S.settings.partner+'です。いっしょに目標を作りましょう。','wave');
    h += '<div class="row wrap-row">'; for (const t of TEMPLATES) h += '<button class="chip'+(W.tpl===t.id?' on':'')+'" data-act="tpl" data-id="'+t.id+'">'+esc(t.name)+'</button>'; h += '</div>';
    h += '<p class="small muted">選ぶと、入力の見本が出ます。見本はそのまま使っても、書き換えてもOKです。</p>';
  } else if (W.step===1){
    h += '<h1>目標と、達成したい日</h1>';
    h += '<label class="fld">目標<input type="text" id="w-title" value="'+esc(W.title)+'" placeholder="例：'+esc(tpl.goal||'達成したいこと')+'"></label>';
    h += '<label class="fld">達成したい日<input type="date" id="w-due" value="'+esc(W.due)+'"></label>';
    h += '<label class="fld">中間目標（ゴールまでの途中の目印・任意）<input type="text" id="w-ms" value="'+esc(W.milestones)+'" placeholder="例：'+esc(tpl.ms||'1か月後に〇〇')+'"></label>';
    if (W.tpl==='side' || W.tpl==='note' || W.tpl==='app') h += '<div class="banner small">金額や結果の目標は、自分だけではコントロールしにくいもの。「毎週3本投稿する」のような行動の目標も、タスクや中間目標に入れておくと進めやすくなります。</div>';
  } else if (W.step===2){
    h += '<h1>なぜ、この目標を達成したいですか？</h1>';
    h += '<label class="fld">理由<textarea id="w-reason" placeholder="例：海外の部署で働きたいから">'+esc(W.reason)+'</textarea></label>';
    h += '<label class="fld">達成したら、どんな未来が待っていますか？<textarea id="w-future" placeholder="例：家族と海外旅行で、自分で道を聞ける">'+esc(W.future)+'</textarea></label>';
  } else if (W.step===3){

    const fromNeeds = NEEDS.map(([id])=>W.needs[id]).filter(Boolean);
    if (fromNeeds.length) h += '<div class="card soft"><span class="xs muted">必要なものメモ</span>'+fromNeeds.map(x=>'<span class="small">・'+esc(x)+'</span>').join('')+'</div>';
    const existing = S.tasks.filter(t=>!t.parentId && W.gid && t.goalId===W.gid).map(t=>t.title);
    if (existing.length) h += '<div class="card"><span class="xs muted">登録済みのタスク</span>'+existing.map(x=>'<span class="small">・'+esc(x)+'</span>').join('')+'</div>';
    h += '<label class="fld">'+(existing.length?'追加するタスク':'タスク')+'<textarea id="w-tasks" style="min-height:140px" placeholder="例：'+esc(tpl.task||'最初にやること')+'">'+esc(W.tasks.join('\n'))+'</textarea></label>';

    h += '<label class="fld">作業する場所と、始める前に整えること（1行に1つ）<textarea id="w-env">'+esc(S.env.join('\n'))+'</textarea></label>';

  if (W.step===1 && !(W.title||'').trim()) h += '<p class="xs muted" style="text-align:center">目標が空のままでも、あとで書けます。</p>';

}
function yesno(id, q, val){
  return '<div style="display:flex;flex-direction:column;gap:8px"><p>'+q+'</p><div class="row"><button class="chip grow'+(val===true?' on':'')+'" data-act="yn" data-q="'+id+'" data-v="1" aria-pressed="'+(val===true)+'">はい</button><button class="chip grow'+(val===false?' on':'')+'" data-act="yn" data-q="'+id+'" data-v="0" aria-pressed="'+(val===false)+'">いいえ</button></div></div>';
}
function readWiz(){
  const W = ui.wiz; const v = id => { const el=document.getElementById(id); return el ? el.value : undefined; };
  if (W.step===1){ W.title=v('w-title')??W.title; W.due=v('w-due')??W.due; W.milestones=v('w-ms')??W.milestones; }
  if (W.step===2){ W.reason=v('w-reason')??W.reason; W.future=v('w-future')??W.future; }
  if (W.step===3){ W.criteria=v('w-crit')??W.criteria; }
  if (W.step===4){ for (const [id] of NEEDS){ const x=v('need-'+id); if(x!==undefined) W.needs[id]=x; } }
  if (W.step===5){ const x=v('w-tasks'); if(x!==undefined) W.tasks=x.split('\n').map(s=>s.trim()).filter(Boolean); W.tmin=Number(v('w-tmin'))||15; }
  if (W.step===6){ W.goalStart=v('w-gs')||W.goalStart; W.goalMin=Number(v('w-gm'))||W.goalMin; const e=v('w-env'); if(e!==undefined) W.env=e.split('\n').map(s=>s.trim()).filter(Boolean); }
}
function wizSave(addSlot){
  readWiz(); const W = ui.wiz;
  if (!goalById(W.gid) && S.goals.length >= MAX_GOALS) { toast('目標は'+MAX_GOALS+'つまでです。'); return; }
  const data = { tpl:W.tpl, title:(W.title||'').trim() || '（目標を書きましょう）', due:W.due||'', reason:W.reason, future:W.future, criteria:W.criteria, milestones:W.milestones, needs:W.needs, checkedAt: todayKey() };
  let g = goalById(W.gid);
  if (g) Object.assign(g, data); else { g = Object.assign({id:'g'+uid(), color:nextColor()}, data); S.goals.push(g); if (!goalById(S.mainGoal)) S.mainGoal = g.id; }
  for (const t of W.tasks) S.tasks.push({id:uid(), title:t, minutes:W.tmin||15, done:false, parentId:null, goalId:g.id});
  if (W.env && W.env.length) S.env = W.env;
  if (addSlot && W.goalDays.length) S.routine.push({id:uid(), kind:'goal', title:'目標タイム', start:W.goalStart, end:toHM(toMin(W.goalStart)+W.goalMin), days:W.goalDays.slice().sort(), goalId: S.goals.length>1 ? g.id : null});
  ui.wiz = null; ui.wizGoal = null; ui.praise = W.editing ? '目標を自分に合わせて直せるのも、大事な力です。' : '目標を言葉にできたのは、大きな一歩です。これからいっしょに進みましょう。';
  save(); location.hash = '#home'; render();
}

const PX = 0.7; // px per minute
function viewDay(){
  const k = ui.day; const items = itemsFor(k);
  let h = '<div class="wrap">';
  h += '<div class="seg" role="group" aria-label="表示の切り替え"><button class="on" data-act="calv" data-v="day">日</button><button data-act="calv" data-v="week">週</button><button data-act="calv" data-v="month">月</button><button data-act="calv" data-v="year">年</button></div>';
  h += '<div class="row"><button class="btn ghost sm" data-act="dayPrev" aria-label="前の日">‹</button><h1 class="grow" style="text-align:center;font-size:18px;'+(dayTone(k)?'color:var(--'+dayTone(k)+')':'')+'">'+fmtDate(k)+(holidayName(k)?' <span class="xs">'+holidayName(k)+'</span>':'')+'</h1><button class="btn ghost sm" data-act="dayNext" aria-label="次の日">›</button></div>';
  h += goalBar();
  if (isGoalDay(k)) h += '<div class="card warm" style="border:2px solid var(--warm-line)"><b style="color:var(--warm)">'+(k===todayKey()?'今日':'この日')+'は目標達成日です</b>'+goalsDue(k).map(g=>'<span class="small">'+esc(g.title)+'</span>').join('')+'</div>';
  if (k!==todayKey()) h += '<button class="link" data-act="dayToday">今日にもどる</button>';
  h += '<div class="scrollbox" style="max-height:62vh;overflow:auto;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:10px 8px 10px 0"><div class="daygrid" id="daygrid" style="height:'+(24*60*PX)+'px">';
  for (let i=0;i<24;i++) h += '<div class="hr" style="top:'+(i*60*PX)+'px"><span>'+i+':00</span></div>';
  // lay out: fixed blocks full width, others narrower when overlapping fixed
  for (const it of items) {
    const s = toMin(it.start), e = Math.max(toMin(it.end)||s+15, s+15);
    const top = s*PX, ht = Math.max(22, (e-s)*PX);
    const overlapFixed = it.kind!=='fixed' && items.some(o=>o.kind==='fixed' && toMin(o.start)<e && (toMin(o.end)||0)>s);
    const label = it.kind==='goal' ? '目標タイム'+(it.task?'：'+it.task.title:'') : (it.task?it.task.title:it.title);
    const cls = it.kind==='goal'?'goal':it.kind==='fixed'?'fixed':'task';
    const gc = it.kind==='goal' && S.goals.length>1 ? 'background:'+goalColor(it.goalId || (it.task && it.task.goalId))+';color:#fff;' : '';
    h += '<button class="blk '+cls+(it.done?' donex':'')+'" data-act="editBlk" data-key="'+esc(it.key)+'" style="top:'+top+'px;height:'+ht+'px;'+gc+(overlapFixed?'left:40%;':'')+'"><span>'+esc(it.start)+' '+esc(label)+(it.done?' ✓':'')+'</span></button>';
  }
  if (k===todayKey()) { const n=new Date(); h += '<div class="nowline" style="top:'+((n.getHours()*60+n.getMinutes())*PX)+'px" aria-hidden="true"></div>'; }
  h += '</div></div>';
  if (ui.editBlk) h += editBlkForm(k);
  h += '<section class="card"><h2>この日に予定を足す</h2>';
  h += '<label class="fld">内容<input type="text" id="add-title" placeholder="例：英単語アプリを10分"></label>';
  h += '<div class="row"><label class="fld grow">開始<input type="time" id="add-start" value="21:00"></label><label class="fld grow">終了<input type="time" id="add-end" value="21:15"></label></div>';
  h += '<label class="fld">種類<select id="add-kind"><option value="task">タスク</option><option value="goal">目標タイム（次のタスクが自動で入る）</option><option value="fixed">いつもの予定以外の用事</option></select></label>';
  h += goalSelect('add-goal', 'どの目標の目標タイム？（種類が目標タイムのとき）');
  const nt = nextTasks();
  if (nt.length) h += '<label class="fld">タスクから選ぶ（任意）<select id="add-task"><option value="">選ばない</option>'+nt.map(t=>'<option value="'+t.id+'">'+(S.goals.length>1 && goalById(t.goalId) ? '['+esc(goalById(t.goalId).title.slice(0,8))+'] ' : '')+esc(t.title)+'</option>').join('')+'</select></label>';
  h += '<button class="btn" data-act="addOne">この日に追加</button></section>';
  h += viewRoutine();
  h += '</div>';
  return h;
}

function goalBar(){
  if (!S.goals.length) return '';
  if (S.settings.hideGoalBar) return '<button class="link" data-act="goalBarShow" style="align-self:flex-end">目標を表示する</button>';
  const many = S.goals.length>1;
  let h = '<div class="card soft" style="padding:10px 14px;gap:2px"><div class="row" style="align-items:flex-start"><div class="grow" style="display:flex;flex-direction:column;gap:6px">';
  goalOrder().forEach((g,i) => {
    h += '<div>'+(i===0?'<span class="xs muted">'+(many?'最終ゴール（いちばん大事な目標）':'最終ゴール')+'</span><br>':'');
    h += gdot(g.id)+(i===0?'<b>'+esc(g.title)+'</b>':'<span class="small">'+esc(g.title)+'</span>');
    if (g.due) { const lf = daysBetween(todayKey(), g.due); h += '<br><span class="'+(i===0?'small':'xs muted')+'"'+(many?' style="padding-left:16px"':'')+'>達成日：'+parseKey(g.due).getFullYear()+'年'+fmtDate(g.due)+(lf>=0 ? '（あと'+lf+'日）' : '')+'</span>'; }

}
function dayStatus(k){
  const L = S.log[k]; const t = todayKey();
  if (L && (L.goal>0 || L.tasks>0)) return 'done';
  if (k < t && plannedGoal(k) && k >= S.created) return 'rest';
  if (k >= t && plannedGoal(k)) return 'plan';
  return '';
}

  } else {

let wpTok = 0, wpFontWait = false;
const NOSTART = '、。，．・：；！？）」』ーぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ…';
function drawWallpaper(){
  const c = document.getElementById('wpc'); const g = wpGoal(); if (!c || !g) return;
  if (document.fonts && document.fonts.status!=='loaded' && !wpFontWait) { wpFontWait = true; document.fonts.ready.then(()=>drawWallpaper()); }
  const pc = ui.wp==='pc'; const W = pc?1920:1080, H = pc?1080:1920; c.width=W; c.height=H;
  const x = c.getContext('2d'); const col = S.settings.color||'#2F6F60'; const gcol = S.goals.length>1 ? g.color : col;
  x.fillStyle='#FBF8F3'; x.fillRect(0,0,W,H);
  x.fillStyle=gcol; x.globalAlpha=.08; x.beginPath(); x.arc(W*0.85,H*0.15,W*0.35,0,7); x.fill(); x.globalAlpha=1;
  const f = "'M PLUS Rounded 1c', sans-serif"; const font = (sz,wt) => wt+' '+sz+'px '+f;
  // split text into lines that fit maxW; cut with "…" after max lines
  const split = (t, maxW, sz, wt, max) => { x.font=font(sz,wt); const out=[]; let line=''; for (const ch of String(t)) { if (ch==='\n') { out.push(line); line=''; continue; } if (x.measureText(line+ch).width>maxW && line && !NOSTART.includes(ch)) { out.push(line); line=ch; } else line+=ch; } if (line) out.push(line);
    if (max && out.length>max) { out.length=max; let l=out[max-1]; while (l && x.measureText(l+'…').width>maxW) l=l.slice(0,-1); out[max-1]=l+'…'; } return out; };
  const block = (t, maxW, sz, wt, y, color, lh, max, lx) => { const ls=split(t,maxW,sz,wt,max); x.font=font(sz,wt); x.fillStyle=color; for (const l of ls) { x.fillText(l, lx, y+sz); y+=sz*lh; } return y; };
  const rr = (X,Y,w,h,r) => { x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); };
  const left = pc?160:100, maxW = pc?1000:880;
  // goal text (top area on phone is left for the lock-screen clock). "なぜ" and "その先に" are shown in full;
  // their font shrinks a little when they are long, so the partner below never overlaps them.
  const name = S.settings.partner||'ピポ'; const msz = pc?28:32, pad = pc?22:24, lh = 1.45, nameSz = pc?26:28;
  const s0 = pc ? 160 : 140, bw0 = pc ? 420 : W - left*2 - s0 - 34;
  const msgLines = split(wpMsg(), bw0-2*pad-msz, msz, '700', 4); const bh0 = msgLines.length*msz*lh + 2*pad;
  const partnerH = pc ? 0 : Math.max(s0 + nameSz + 16, bh0) + 70;
  const limit = pc ? H - 90 : H - 200 - partnerH;
  const textEnd = (y0, rsz, draw) => {
    const B = (t, sz, wt, y, color, l, max) => draw ? block(t, maxW, sz, wt, y, color, l, max, left) : y + split(t, maxW, sz, wt, max).length*sz*l;
    let y = y0;
    y = B('わたしの目標', pc?40:46, '500', y, '#5F5B55', 1.4, 1);
    y = B(g.title, pc?80:92, '700', y+16, '#2B2A28', 1.3, 3);
    if (g.due) y = B(parseKey(g.due).getFullYear()+'年'+fmtDate(g.due)+' まで', pc?40:46, '700', y+10, gcol, 1.4, 1);
    if (g.reason) y = B('なぜ：'+g.reason, rsz, '400', y+30, '#5F5B55', 1.5, 0);
    if (g.future) y = B('その先に：'+g.future, rsz, '400', y+10, '#5F5B55', 1.5, 0);
    return y;
  };
  let y0 = pc ? 200 : Math.round(H*0.25), rsz = pc ? 36 : 42; const minR = pc ? 24 : 28;
  while (rsz > minR && textEnd(y0, rsz, false) > limit) rsz -= 2;
  if (textEnd(y0, rsz, false) > limit) y0 = Math.max(pc ? 80 : Math.round(H*0.12), y0 - (textEnd(y0, rsz, false) - limit));
  const y = textEnd(y0, rsz, true);
  // partner + message, in its own area so it never covers the goal text
  let s, px, py, bx, by, bw, ls, bh;
  if (pc) {
    s = s0; bw = bw0; bx = W-140-bw; ls = msgLines; bh = bh0;
    const total = bh + 40 + s + nameSz + 16; by = Math.max(80, Math.round((H-total)/2)); py = by + bh + 40; px = bx + (bw-s)/2;
  } else {
    const top = y + 70, bottom = H - 200;
    s = (top + Math.max(s0 + nameSz + 16, bh0) <= bottom) ? s0 : 0;
    px = left; bx = s ? left + s + 34 : left; bw = W - left - bx;
    ls = s ? msgLines : split(name+'：'+wpMsg(), bw-2*pad-msz, msz, '700', 4); bh = ls.length*msz*lh + 2*pad;
    py = top; by = top + Math.max(0, Math.round((s - bh)/2));
  }
  x.fillStyle='#FFFFFF'; x.strokeStyle=col; x.lineWidth=4; rr(bx,by,bw,bh,28); x.fill(); x.stroke();
  if (s) { x.beginPath();
    if (pc) { const cx=bx+bw/2; x.moveTo(cx-20,by+bh-3); x.lineTo(cx,by+bh+28); x.lineTo(cx+20,by+bh-3); }
    else { const cy=by+Math.min(bh/2, s/2); x.moveTo(bx+3,cy-20); x.lineTo(bx-28,cy); x.lineTo(bx+3,cy+20); }
    x.fillStyle='#FFFFFF'; x.fill(); x.stroke();
    x.fillStyle='#FFFFFF'; if (pc) x.fillRect(bx+bw/2-18, by+bh-6, 36, 5); else { const cy=by+Math.min(bh/2, s/2); x.fillRect(bx-1, cy-18, 6, 36); } }
  x.font=font(msz,'700'); x.fillStyle='#2B2A28'; ls.forEach((l,i)=>x.fillText(l, bx+pad, by+pad+msz*0.9+i*msz*lh));
  if (!s) return;
  x.font=font(nameSz,'500'); x.fillStyle='#5F5B55'; x.textAlign='center'; x.fillText(name, px+s/2, py+s+nameSz+6); x.textAlign='left';
  const tok = ++wpTok; const img = new Image();
  img.onload = () => { if (tok===wpTok) x.drawImage(img, px, py, s, s); };
  img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(pipo(64,'happy').replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));
}

  h += '<p style="text-align:center">'+ui.welcomeDays+'日ぶりですね。<br>戻ってこれたことが、一番大事な一歩です。</p>';
  h += '<div class="card"><span class="xs muted">思い出してみましょう</span><b>'+esc(G().title)+'</b>'+(G().future?'<span class="small">達成したら：'+esc(G().future)+'</span>':(G().reason?'<span class="small">なぜ：'+esc(G().reason)+'</span>':''))+'</div>';
  if (t) h += '<div class="card soft"><span class="xs" style="font-weight:700;color:var(--accent)">今日はこれだけで大丈夫</span><b>'+esc(t.title)+' を3分だけ</b></div>';
  h += '<p class="small muted" style="text-align:center">これまでに取り組んだ日：合計 <b>'+activeDays()+'日</b>（消えていません）</p>';
  if (t) h += '<button class="btn block" data-act="wbStart" data-id="'+t.id+'">3分だけやってみる</button>';
  h += '<button class="btn ghost block" data-act="wbReset">予定を組み直す</button><button class="link" data-act="wbClose" style="align-self:center">ホームを見る</button></div></div>';
  return h;
}

/* ---------- actions ---------- */
function findItem(k, key){ return itemsFor(k).find(i=>i.key===key); }
function markItem(k, it, on){
  S.done[k] = S.done[k]||{};
  if (on) { S.done[k][it.key] = {taskId: it.task?it.task.id:null}; } else delete S.done[k][it.key];
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; const k = todayKey();
  if (b.tagName==='INPUT') return; // handled by change
  switch(a){
    case 'dismissMsg': ui.msg=null; break;
    case 'goalBarHide': S.settings.hideGoalBar=true; save(); toast('目標の表示を隠しました。「目標を表示する」で戻せます。'); break;
    case 'goalBarShow': S.settings.hideGoalBar=false; save(); break;
    case 'challenge': logOf(k).challenge=true; ui.praise='初めてのことに挑戦できましたね。挑戦する力が育っています。'; save(); break;
    case 'challengeNext': S.settings.challengeOffset=S.settings.challengeOffset||{}; S.settings.challengeOffset={[k]:((S.settings.challengeOffset[k]||0)+1)}; save(); break;
    case 'split': ui.splitFor=b.dataset.id; break;
    case 'splitCancel': ui.splitFor=null; break;
    case 'splitSave': { const lines=(document.getElementById('split-text').value||'').split('\n').map(s=>s.trim()).filter(Boolean); const parent=S.tasks.find(t=>t.id===b.dataset.id); if(parent && lines.length){ const idx=S.tasks.indexOf(parent); const kids=lines.map(l=>({id:uid(),title:l,minutes:Math.max(5,Math.round((parent.minutes||15)/lines.length)),done:false,parentId:parent.id,goalId:parent.goalId})); S.tasks.splice(idx+1,0,...kids); ui.praise='小さく分けられるのは、続ける人のやり方です。まずは「'+lines[0]+'」から。'; save(); } ui.splitFor=null; break; }
    case 'start': { const it=findItem(k,b.dataset.key); if(!it) return; const r = S.routine.find(x=>x.id===it.rid); const mins = Math.max(1, (toMin(it.end)-toMin(it.start)) || 15); ui.timer={phase:'env', key:it.key, k, title: it.task?it.task.title:'目標タイム', taskId: it.task?it.task.id:null, minutes: mins, env:{}}; break; }
    case 'timerGo': { const m=Number(document.getElementById('tm-min').value)||ui.timer.minutes; ui.timer.minutes=m; ui.timer.phase='run'; ui.timer.endAt=Date.now()+m*60000; startTick(); try{ if(navigator.wakeLock) ui.wl = await navigator.wakeLock.request('screen'); }catch(_){} break; }
    case 'timerCancel': ui.timer=null; try{ui.wl&&ui.wl.release();}catch(_){} ui.praise='ここまで来られただけでも十分です。また次の目標タイムで。'; break;
    case 'timerDone': { const T=ui.timer; const L=logOf(T.k); L.goal=(L.goal||0)+1; L.minutes=(L.minutes||0)+Math.round((T.minutes*60000-Math.max(0,T.endAt-Date.now()))/60000);
      if (T.key && !T.key.startsWith('free')) { S.done[T.k]=S.done[T.k]||{}; S.done[T.k][T.key]={taskId:T.taskId}; }
      const t=S.tasks.find(x=>x.id===T.taskId); if(t && !t.done) setDone(t,true,T.k);
      ui.timer=null; try{ui.wl&&ui.wl.release();}catch(_){} ui.praise=PRAISE[Math.floor(Math.random()*PRAISE.length)]; save(); location.hash='#home'; break; }
    case 'tpl': { const W=ui.wiz; W.tpl=b.dataset.id; break; }
    case 'yn': { const v=b.dataset.v==='1'; const q=b.dataset.q; if(q==='m1'||q==='m2'){ ui.review[q]=v; } else { readWiz(); ui.wiz[q]=v; } break; }
    case 'wday': { readWiz(); const d=Number(b.dataset.d); const W=ui.wiz; W.goalDays = W.goalDays.includes(d) ? W.goalDays.filter(x=>x!==d) : W.goalDays.concat(d); break; }
    case 'wizNext': if(b.disabled) return; readWiz(); ui.wiz.step++; window.scrollTo(0,0); break;
    case 'wizBack': readWiz(); if(ui.wiz.step===0){ if(G()){ ui.wiz=null; ui.wizGoal=null; location.hash='#more'; } return; } ui.wiz.step--; break;
    case 'wizSave': wizSave(true); return;
    case 'wizSaveNoSlot': wizSave(false); return;
    case 'editGoal': ui.wiz=null; ui.wizGoal=b.dataset.id||null; ui.review.m1=null; ui.review.m2=null; return;
    case 'newGoal': if (S.goals.length>=MAX_GOALS) { e.preventDefault(); toast('目標は'+MAX_GOALS+'つまでです。'); return; } ui.wiz=null; ui.wizGoal='new'; ui.addAsk=false; return;
    case 'addAsk': ui.addAsk=true; break;
    case 'addCancel': ui.addAsk=false; break;
    case 'setMain': { S.mainGoal=b.dataset.id; save(); const g=goalById(b.dataset.id); toast('「'+(g?g.title:'')+'」をいちばん大事な目標にしました。'); break; }
    case 'delGoalAsk': ui.delAsk=b.dataset.id; break;
    case 'delGoalCancel': ui.delAsk=null; break;
    case 'delGoalDo': { const id=b.dataset.id; S.goals=S.goals.filter(g=>g.id!==id); S.tasks=S.tasks.filter(t=>t.goalId!==id); for (const r of S.routine) if (r.goalId===id) r.goalId=null; for (const o of S.oneoffs) if (o.goalId===id) o.goalId=null; if (S.mainGoal===id) S.mainGoal=S.goals.length?S.goals[0].id:null; if (ui.wpGoal===id) ui.wpGoal=null; ui.delAsk=null; save(); toast('削除しました。'); break; }
    case 'wpPreset': S.settings.wpMsg=WP_MSGS[Number(b.dataset.i)]||''; save(); break;
    case 'monthOk': G().checkedAt=k; ui.review={weekOf:ui.review.weekOf}; save(); toast('このまま進みましょう。'); break;
    case 'dayPrev': ui.day=dkey(addDays(parseKey(ui.day),-1)); ui.editBlk=null; break;
    case 'dayNext': ui.day=dkey(addDays(parseKey(ui.day),1)); ui.editBlk=null; break;
    case 'dayToday': ui.day=k; break;
    case 'calv': { const v=b.dataset.v; if(v==='day'){ location.hash='#day'; return; } ui.calView=v; if(route()!=='calendar'){ ui.calMonth=ui.day; location.hash='#calendar'; return; } break; }
    case 'calPrev': case 'calNext': { const dir=a==='calPrev'?-1:1; const cur = ui.calMonth?parseKey(ui.calMonth):new Date(); let n; if(ui.calView==='year') n=new Date(cur.getFullYear()+dir,0,1); else if(ui.calView==='week') n=addDays(cur,7*dir); else n=new Date(cur.getFullYear(),cur.getMonth()+dir,1); ui.calMonth=dkey(n); break; }
    case 'openDay': ui.day=b.dataset.k; ui.editBlk=null; location.hash='#day'; return;
    case 'openMonth': ui.calMonth=b.dataset.k; ui.calView='month'; break;
    case 'editBlk': ui.editBlk=b.dataset.key; render(); document.getElementById('eb-start')?.focus(); return;
    case 'ebClose': ui.editBlk=null; break;
    case 'ebSkip': case 'ebSave': case 'ebDone': { const it=findItem(ui.day, ui.editBlk); if(!it) break; const d=ui.day;
      if (a==='ebDone') { const on=!it.done; markItem(d,it,on); if(it.task && it.kind!=='goal') setDone(it.task,on,d); if(it.kind==='goal'){ const L=logOf(d); L.goal=Math.max(0,(L.goal||0)+(on?1:-1)); if(on&&it.task&&!it.task.done) setDone(it.task,true,d);} }
      else if (it.oid) { const o=S.oneoffs.find(x=>x.id===it.oid); if(a==='ebSkip') S.oneoffs=S.oneoffs.filter(x=>x.id!==it.oid); else { o.start=document.getElementById('eb-start').value||o.start; o.end=document.getElementById('eb-end').value||o.end; } }
      else { S.skips[d]=(S.skips[d]||[]).concat(it.rid); if(a==='ebSave'){ S.oneoffs.push({id:uid(),date:d,start:document.getElementById('eb-start').value||it.start,end:document.getElementById('eb-end').value||it.end,title:it.title,kind:it.kind,goalId:it.goalId||null}); } }
      ui.editBlk=null; save(); toast(a==='ebSkip'?'この日はお休みにしました。':'変更しました。'); break; }
    case 'addOne': { const title=document.getElementById('add-title').value.trim(); const tsel=document.getElementById('add-task'); const taskId=tsel?tsel.value:''; const kind=document.getElementById('add-kind').value; const t=S.tasks.find(x=>x.id===taskId);
      if(!title && !t && kind!=='goal'){ toast('内容を入れるか、タスクを選んでください。'); return; }
      S.oneoffs.push({id:uid(),date:ui.day,start:document.getElementById('add-start').value||'21:00',end:document.getElementById('add-end').value||'21:15',title:title||(t?t.title:'目標タイム'),kind:t?'task':kind,taskId:t?t.id:null,goalId:(!t && kind==='goal' && document.getElementById('add-goal')) ? (document.getElementById('add-goal').value||null) : null}); save(); toast('追加しました。'); break; }
    case 'addRoutine': { const kind=document.getElementById('rt-kind').value; const title=document.getElementById('rt-title').value.trim(); const days=[...document.querySelectorAll('#rt-days input:checked')].map(i=>Number(i.value)); if(!days.length){ toast('曜日を1つ以上選んでください。'); return; } if(kind!=='goal' && !title){ toast('内容を入れてください。'); return; }
      S.routine.push({id:uid(),kind,title:kind==='goal'?'目標タイム':title,start:document.getElementById('rt-start').value||'07:00',end:document.getElementById('rt-end').value||'07:15',days,goalId:(kind==='goal' && document.getElementById('rt-goal')) ? (document.getElementById('rt-goal').value||null) : null}); save(); toast('追加しました。'); break; }
    case 'delRoutine': S.routine=S.routine.filter(r=>r.id!==b.dataset.id); save(); break;
    case 'reason': { const wk=dkey(ui.review.weekOf?parseKey(ui.review.weekOf):weekStart(new Date())); S.reviews[wk]=Object.assign({},S.reviews[wk],{reason:b.dataset.id}); save(); break; }
    case 'saveNote': { const wk=dkey(ui.review.weekOf?parseKey(ui.review.weekOf):weekStart(new Date())); S.reviews[wk]=Object.assign({},S.reviews[wk],{note:document.getElementById('rev-note').value}); save(); toast('メモを保存しました。'); return; }
    case 'revPrev': case 'revNext': { const cur=ui.review.weekOf?parseKey(ui.review.weekOf):weekStart(new Date()); ui.review.weekOf=dkey(addDays(cur,a==='revPrev'?-7:7)); break; }
    case 'addTask': { const v=document.getElementById('nt-title').value.trim(); if(!v) return; const gs=document.getElementById('nt-goal'); const gid=(gs&&gs.value)||(G()&&G().id); if(!gid){ toast('先に目標を作りましょう。'); return; } ui.ntGoal=gid; S.tasks.push({id:uid(),title:v,minutes:15,done:false,parentId:null,goalId:gid}); save(); break; }
    case 'delTask': { const id=b.dataset.id; const kill=new Set([id]); let grew=true; while(grew){ grew=false; for(const t of S.tasks) if(t.parentId&&kill.has(t.parentId)&&!kill.has(t.id)){ kill.add(t.id); grew=true; } } S.tasks=S.tasks.filter(t=>!kill.has(t.id)); save(); break; }
    case 'moveUp': { const t=S.tasks.find(x=>x.id===b.dataset.id); const sib=S.tasks.filter(x=>(x.parentId||null)===(t.parentId||null) && x.goalId===t.goalId); const i=sib.indexOf(t); if(i>0){ const prev=sib[i-1]; const ai=S.tasks.indexOf(t), bi=S.tasks.indexOf(prev); S.tasks[ai]=prev; S.tasks[bi]=t; save(); } break; }
    case 'wp': ui.wp=b.dataset.v; break;
    case 'saveWp': { const c=document.getElementById('wpc'); if(!c) return; c.toBlob(blob => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='chiisana-ippo-wallpaper-'+(ui.wp==='pc'?'pc':'phone')+'.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }, 'image/png'); return; }
    case 'exportData': { const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='chiisana-ippo-backup-'+todayKey()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('バックアップを保存しました。'); return; }
    case 'importAsk': document.getElementById('import-file').click(); return;
    case 'color': S.settings.color=b.dataset.c; save(); break;
    case 'savePartner': { const v=document.getElementById('pt-name').value.trim(); if(v){ S.settings.partner=v; save(); toast('名前を「'+v+'」にしました。'); } break; }
    case 'saveEnv': S.env=document.getElementById('env-list').value.split('\n').map(s=>s.trim()).filter(Boolean); save(); toast('保存しました。'); break;
    case 'wbStart': { const t=S.tasks.find(x=>x.id===b.dataset.id); ui.welcome=false; ui.timer={phase:'env', key:'free:'+t.id, k, title:t.title, taskId:t.id, minutes:3, env:{}}; break; }
    case 'wbReset': ui.welcome=false; location.hash='#day'; return;
    case 'wbClose': ui.welcome=false; break;
    default: return;
  }
  render();
});
document.addEventListener('change', (e) => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  const k = todayKey();
  if (a==='toggle') { const key=el.dataset.key; if (key.startsWith('t:')) { const t=S.tasks.find(x=>x.id===key.slice(2)); if(t){ setDone(t, el.checked, k); if(el.checked) ui.praise=PRAISE[Math.floor(Math.random()*PRAISE.length)]; } }
    else { const it=findItem(k,key); if(it){ markItem(k,it,el.checked); if(it.task) setDone(it.task, el.checked, k); else { const L=logOf(k); L.tasks=Math.max(0,(L.tasks||0)+(el.checked?1:-1)); } if(el.checked) ui.praise=PRAISE[Math.floor(Math.random()*PRAISE.length)]; } }
    save(); render(); }
  if (a==='toggleTask') { const t=S.tasks.find(x=>x.id===el.dataset.id); if(t){ setDone(t, el.checked, k); save(); render(); } }
  if (a==='envck') { ui.timer.env[el.dataset.i]=el.checked; }
  if (a==='wpGoal') { ui.wpGoal=el.value; drawWallpaper(); }
});
document.addEventListener('change', (e) => { if (e.target.id!=='import-file') return; const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try { const d=JSON.parse(r.result); if(!d || typeof d!=='object' || !(d.goals||d.goal)) throw 0; S=Object.assign(blankState(), d); migrate(); save(); ui.wiz=null; toast('読み込みました。'); render(); } catch(_){ toast('このファイルは読み込めませんでした。'); } }; r.readAsText(f); e.target.value=''; });
document.addEventListener('input', (e) => { if (e.target.id==='wp-msg') { S.settings.wpMsg=e.target.value; save(); drawWallpaper(); } });
document.addEventListener('keydown', (e) => { if (e.key==='Enter' && e.target.id==='nt-title') { e.preventDefault(); document.querySelector('[data-act="addTask"]').click(); } });

/* ---------- boot ---------- */
function afterLoad(){
  const t = todayKey();
  if (migrate()) save();
  if (G() && S.lastOpen && S.lastOpen < t) { const gap = daysBetween(S.lastOpen, t); if (gap >= 3) { ui.welcome = true; ui.welcomeDays = gap; } }
  if (S.lastOpen !== t) { S.lastOpen = t; save(); }
  ready = true; render();
}
render();
(async () => {
  storeMode = 'web';
  try { const raw = localStorage.getItem('chiisana-ippo'); if (raw) S = Object.assign(blankState(), JSON.parse(raw)); } catch(e){}
  afterLoad();
})();
})();
</script>
